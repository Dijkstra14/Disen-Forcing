# configs/disen.yaml on one node with 4 GPUs: the same 64 samples per optimizer step via 2x gradient accumulation.
# Checkpoint directories count micro-steps, so effective step 200 is checkpoint_model_003200 here.
base: configs/disen.yaml
gradient_accumulation_steps: 16          # 4 GPUs x 16 micro-steps = 64 samples per optimizer step
